name: Build unsigned IPA

on:
  push:
    branches:
      - "claude/**"
      - main

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test and bundle the web app
        working-directory: webapp
        run: |
          npm ci
          npm test
          npm run build

      - name: Toolchain info
        run: |
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project CubeTutor.xcodeproj \
            -scheme CubeTutor \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -n 80

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/CubeTutor.app"
          test -d "$APP"
          rm -rf Payload dist && mkdir -p Payload dist
          cp -R "$APP" Payload/
          zip -qry dist/CubeTutor-unsigned.ipa Payload
          echo "== IPA contents (top) =="
          unzip -l dist/CubeTutor-unsigned.ipa | head -n 40
          echo "== Info.plist lint =="
          plutil -lint Payload/CubeTutor.app/Info.plist
          plutil -p Payload/CubeTutor.app/Info.plist
          echo "== Binary architecture / platform =="
          lipo -info Payload/CubeTutor.app/CubeTutor
          vtool -show-build Payload/CubeTutor.app/CubeTutor
          echo "== App bundle files =="
          ls -la Payload/CubeTutor.app
          plutil -p Payload/CubeTutor.app/Info.plist | grep -A8 CFBundleIcons || echo "WARNING: no CFBundleIcons"
          echo "== Web bundle present =="
          ls -la Payload/CubeTutor.app/web
          ls -la dist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CubeTutor-unsigned-ipa
          path: dist/CubeTutor-unsigned.ipa
          if-no-files-found: error

      - name: Simulator smoke test (renders the app in real WebKit)
        continue-on-error: true
        run: |
          set -x
          xcodebuild build \
            -project CubeTutor.xcodeproj -scheme CubeTutor -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO | tail -n 5
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" build-sim/Build/Products/Debug-iphonesimulator/CubeTutor.app
          xcrun simctl launch "$DEV" com.example.cubetutor
          sleep 25
          mkdir -p shots
          xcrun simctl io "$DEV" screenshot shots/simulator-home.png
          ls -la shots

      - name: Upload simulator screenshot
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: shots/
          if-no-files-found: warn
